<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="vortexBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a161f"/>
      <stop offset="50%" stop-color="#190e16"/>
      <stop offset="100%" stop-color="#0f070e"/>
    </radialGradient>

    <!-- Core Golden Aura -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe875" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .orbit-label { font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; fill: #fde68a; letter-spacing: 1px; }
    .badge-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    .badge-sub { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 10px; fill: #fef08a; }
    .vortex-header { font-family: 'Courier New', monospace; font-weight: 900; font-size: 20px; fill: #fed782; letter-spacing: 3px; }
    .vortex-sub { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #d97706; letter-spacing: 1px; }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseAura {
      0%, 100% { transform: scale(1.0); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1.0; }
    }
    .pulsing-aura {
      transform-origin: 460px 240px;
      animation: pulseAura 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="480" rx="16" fill="url(#vortexBg)" stroke="#451a24" stroke-width="2"/>

  <!-- Starry / Magical Dust Particles -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="60" r="1.2"/>
    <circle cx="780" cy="90" r="1.5"/>
    <circle cx="850" cy="220" r="1.2"/>
    <circle cx="100" cy="380" r="1.5"/>
    <circle cx="820" cy="410" r="1.2"/>
    <circle cx="680" cy="430" r="1.5"/>
    <circle cx="200" cy="420" r="1.2"/>
  </g>

  <!-- Header Text -->
  <g text-anchor="middle" transform="translate(460, 40)">
    <text class="vortex-header" filter="url(#glowGold)">🌪️ THE INGREDIENT VORTEX ORBIT 🌪️</text>
    <text y="22" class="vortex-sub">Multitier Cosmic Orbit Swirling Around The Minecraft Cookie Core</text>
  </g>

  <!-- ================= VORTEX ORBITAL RINGS ================= -->

  <!-- Outer Orbit 3 (Tools & Minecraft Platform) - Purple/Emerald -->
  <g transform="rotate(-7 460 240)">
    <ellipse cx="460" cy="240" rx="400" ry="145" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="14,10" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;240" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="460" cy="240" rx="400" ry="145" fill="none" stroke="#65a30d" stroke-width="1.2" stroke-dasharray="6,18" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="240;0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Middle Orbit 2 (Systems, Frontend & Languages) - Cyan/Gold -->
  <g transform="rotate(16 460 240)">
    <ellipse cx="460" cy="240" rx="305" ry="105" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="16,8" opacity="0.55">
      <animate attributeName="stroke-dashoffset" values="0;240" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="460" cy="240" rx="305" ry="105" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,12" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="240;0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Inner Orbit 1 (Core Backend & Specialty) - Fiery Amber -->
  <g transform="rotate(-18 460 240)">
    <ellipse cx="460" cy="240" rx="195" ry="68" fill="none" stroke="#f59e0b" stroke-width="2.8" stroke-dasharray="12,6" opacity="0.8" filter="url(#glowGold)">
      <animate attributeName="stroke-dashoffset" values="0;240" dur="10s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Swirling Particle Flow Lines -->
  <path d="M 160 140 Q 300 180 460 240 Q 620 300 760 340" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="8,16" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;200" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M 780 140 Q 620 180 460 240 Q 300 300 140 340" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="8,16" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="200;0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- ================= CENTER COOKIE CORE ================= -->
  <!-- Glowing Aura -->
  <circle cx="460" cy="240" r="90" fill="url(#coreAura)" class="pulsing-aura"/>
  <circle cx="460" cy="240" r="55" fill="#f59e0b" opacity="0.2" filter="url(#glowGold)"/>

  <!-- Minecraft Pixel Art Cookie at the Center (Scale & Positioned) -->
  <g transform="translate(424, 204) scale(2.25)" filter="url(#badgeShadow)">
    <!-- Cookie Outer Contour (Pixel Grid) -->
    <g fill="#281306">
      <rect x="10" y="3" width="12" height="2"/><rect x="10" y="27" width="12" height="2"/>
      <rect x="6" y="5" width="4" height="2"/><rect x="22" y="5" width="4" height="2"/>
      <rect x="4" y="7" width="2" height="3"/><rect x="26" y="7" width="2" height="3"/>
      <rect x="2" y="10" width="2" height="12"/><rect x="28" y="10" width="2" height="12"/>
      <rect x="4" y="22" width="2" height="3"/><rect x="26" y="22" width="2" height="3"/>
      <rect x="6" y="25" width="4" height="2"/><rect x="22" y="25" width="4" height="2"/>
    </g>
    <!-- Baked Crust -->
    <g fill="#873f11">
      <rect x="10" y="5" width="12" height="2"/><rect x="6" y="7" width="4" height="3"/>
      <rect x="22" y="7" width="4" height="3"/><rect x="4" y="10" width="2" height="12"/>
      <rect x="26" y="10" width="2" height="12"/><rect x="4" y="20" width="4" height="3"/>
      <rect x="24" y="20" width="4" height="3"/><rect x="8" y="24" width="16" height="3"/>
    </g>
    <!-- Wheat Body -->
    <g fill="#c9741c">
      <rect x="6" y="10" width="20" height="13"/>
      <rect x="10" y="7" width="12" height="3"/>
      <rect x="8" y="8" width="16" height="2"/>
    </g>
    <!-- Highlight Surface -->
    <g fill="#e89830">
      <rect x="10" y="7" width="10" height="2"/><rect x="8" y="9" width="6" height="3"/>
      <rect x="18" y="9" width="6" height="3"/><rect x="6" y="12" width="4" height="6"/>
      <rect x="12" y="14" width="8" height="4"/>
    </g>
    <!-- Golden Crisps -->
    <g fill="#fed782">
      <rect x="11" y="7" width="4" height="1"/><rect x="9" y="9" width="2" height="2"/>
      <rect x="19" y="9" width="2" height="2"/><rect x="7" y="13" width="2" height="2"/>
    </g>
    <!-- Chocolate Chips -->
    <rect x="10" y="10" width="3" height="3" fill="#1b0c04"/><rect x="11" y="11" width="3" height="3" fill="#381807"/>
    <rect x="19" y="12" width="4" height="3" fill="#1b0c04"/><rect x="20" y="13" width="4" height="3" fill="#381807"/>
    <rect x="13" y="17" width="4" height="4" fill="#1b0c04"/><rect x="14" y="18" width="4" height="4" fill="#381807"/>
    <rect x="8" y="18" width="3" height="3" fill="#1b0c04"/><rect x="9" y="19" width="3" height="3" fill="#381807"/>
    <rect x="20" y="20" width="3" height="3" fill="#1b0c04"/><rect x="21" y="21" width="3" height="3" fill="#381807"/>
  </g>

  <!-- Core Label -->
  <text x="460" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#fffbeb" filter="url(#glowGold)">CORE GRAVITY</text>

  <!-- ================= ORBITING TECH BADGES ================= -->

  <!-- --- INNER ORBIT 1: Core Languages --- -->
  
  <!-- JAVA (The Kingpin Badge - Golden Glowing) -->
  <g transform="translate(415, 120)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="415,120; 415,114; 415,120" dur="3s" repeatCount="indefinite"/>
    <rect width="90" height="36" rx="8" fill="#3b1d11" stroke="#f59e0b" stroke-width="2.5" filter="url(#glowGold)"/>
    <circle cx="20" cy="18" r="10" fill="#f59e0b"/>
    <text x="20" y="23" text-anchor="middle" font-size="14">☕</text>
    <text x="36" y="19" class="badge-title">JAVA</text>
    <text x="36" y="30" class="badge-sub">SPECIALTY</text>
  </g>

  <!-- PYTHON -->
  <g transform="translate(290, 245)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="290,245; 290,251; 290,245" dur="3.6s" repeatCount="indefinite"/>
    <rect width="84" height="32" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="14" y="21" font-size="14">🐍</text>
    <text x="32" y="21" class="badge-title">Python</text>
  </g>

  <!-- TYPESCRIPT -->
  <g transform="translate(545, 245)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="545,245; 545,239; 545,245" dur="3.4s" repeatCount="indefinite"/>
    <rect width="105" height="32" rx="7" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="14" y="21" font-size="14">🟦</text>
    <text x="32" y="21" class="badge-title">TypeScript</text>
  </g>

  <!-- RUST -->
  <g transform="translate(420, 325)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="420,325; 420,331; 420,325" dur="4s" repeatCount="indefinite"/>
    <rect width="80" height="32" rx="7" fill="#261b18" stroke="#ea580c" stroke-width="1.8"/>
    <text x="14" y="21" font-size="14">🦀</text>
    <text x="32" y="21" class="badge-title">Rust</text>
  </g>

  <!-- --- MIDDLE ORBIT 2: Systems, Web & Frontend --- -->

  <!-- C++ -->
  <g transform="translate(195, 160)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="195,160; 195,153; 195,160" dur="4.2s" repeatCount="indefinite"/>
    <rect width="76" height="30" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">⚡</text>
    <text x="28" y="20" class="badge-title">C++</text>
  </g>

  <!-- C# -->
  <g transform="translate(640, 160)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="640,160; 640,167; 640,160" dur="3.8s" repeatCount="indefinite"/>
    <rect width="70" height="30" rx="6" fill="#142118" stroke="#16a34a" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">🔷</text>
    <text x="28" y="20" class="badge-title">C#</text>
  </g>

  <!-- REACT.JS -->
  <g transform="translate(200, 315)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="200,315; 200,322; 200,315" dur="4.5s" repeatCount="indefinite"/>
    <rect width="88" height="30" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">⚛️</text>
    <text x="28" y="20" class="badge-title">React.js</text>
  </g>

  <!-- JAVASCRIPT -->
  <g transform="translate(645, 315)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="645,315; 645,308; 645,315" dur="4.1s" repeatCount="indefinite"/>
    <rect width="102" height="30" rx="6" fill="#2d2812" stroke="#eab308" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">🟨</text>
    <text x="28" y="20" class="badge-title">JavaScript</text>
  </g>

  <!-- --- OUTER ORBIT 3: Platforms, Minecraft & DevOps --- -->

  <!-- SPIGOT / PAPERMC -->
  <g transform="translate(80, 235)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="80,235; 80,227; 80,235" dur="5s" repeatCount="indefinite"/>
    <rect width="125" height="34" rx="8" fill="#3b1d11" stroke="#d97706" stroke-width="2"/>
    <text x="12" y="22" font-size="14">⛏️</text>
    <text x="32" y="22" class="badge-title">Spigot / Paper</text>
  </g>

  <!-- SKRIPTLANG -->
  <g transform="translate(280, 85)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="280,85; 280,92; 280,85" dur="4.7s" repeatCount="indefinite"/>
    <rect width="108" height="30" rx="6" fill="#142e1b" stroke="#4ade80" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">📜</text>
    <text x="30" y="20" class="badge-title">SkriptLang</text>
  </g>

  <!-- DOCKER -->
  <g transform="translate(565, 85)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="565,85; 565,78; 565,85" dur="4.3s" repeatCount="indefinite"/>
    <rect width="88" height="30" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="12" y="20" font-size="13">🐳</text>
    <text x="30" y="20" class="badge-title">Docker</text>
  </g>

  <!-- LINUX -->
  <g transform="translate(735, 235)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="735,235; 735,243; 735,235" dur="5.2s" repeatCount="indefinite"/>
    <rect width="84" height="32" rx="7" fill="#1e1b18" stroke="#facc15" stroke-width="1.8"/>
    <text x="12" y="21" font-size="14">🐧</text>
    <text x="30" y="21" class="badge-title">Linux</text>
  </g>

  <!-- GIT -->
  <g transform="translate(330, 400)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="330,400; 330,393; 330,400" dur="4.6s" repeatCount="indefinite"/>
    <rect width="72" height="28" rx="6" fill="#2d1512" stroke="#f97316" stroke-width="1.5"/>
    <text x="10" y="19" font-size="12">🐙</text>
    <text x="26" y="19" class="badge-title">Git</text>
  </g>

  <!-- HTML / CSS -->
  <g transform="translate(520, 400)" filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="520,400; 520,407; 520,400" dur="4.4s" repeatCount="indefinite"/>
    <rect width="112" height="28" rx="6" fill="#271521" stroke="#ec4899" stroke-width="1.5"/>
    <text x="10" y="19" font-size="12">🌐</text>
    <text x="26" y="19" class="badge-title">HTML5 / CSS3</text>
  </g>

</svg>

name: Generate Bakery Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23d97706&color_dots=%23ebedf0,%23fde68a,%23f59e0b,%23d97706,%2378350f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f59e0b&color_dots=%23231d19,%2378350f,%23b45309,%23f59e0b,%23fef3c7

      - name: Deploy snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
